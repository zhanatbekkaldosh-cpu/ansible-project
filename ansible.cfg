# ansible.cfg
[defaults]
inventory       = inventory/aws_ec2.yml
collections_path = ./collections
roles_path      = ./roles
private_key_file = /home/ec2-user/.ssh/ansible-service-key

#[ssh_connection]
#ssh_args = -o ProxyJump=ec2-user@<bastion_public_ip>
[privilege_escalation]
become=true
become_method=sudo
become_user=root
become_ask_pass=false
